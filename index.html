<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2f6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blend Path</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#f5f2ec; --ink:#2d2a26; --muted:#6b645b; --card:#fffdf9; --accent:#2f6b57; --line:#e2dcd0; --tile:#ece6d8; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body { touch-action: manipulation; overflow:hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .view { position:fixed; inset:0; display:flex; flex-direction:column; overflow-y:auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px); max-width: 560px; margin: 0 auto; }
  h1 { margin:6px 0 2px; font-size:34px; letter-spacing:-.5px; }
  .sub { margin:0 0 18px; color:var(--muted); font-size:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:14px; }
  .eyebrow { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .big { font-size:20px; font-weight:650; margin:4px 0 12px; }
  .primary, .secondary { min-height:52px; padding:0 22px; border:none; border-radius:14px; font-size:17px; font-weight:650; }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:#e9e3d6; color:var(--ink); }
  .ghost { min-height:44px; padding:0 14px; border:none; background:transparent; border-radius:12px; font-size:16px; }
  .ghost:disabled, .secondary:disabled { opacity:.35; cursor:default; }
  .wide { width:100%; }
  h2.st { font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:22px 0 6px; }
  p.note { margin:0 0 12px; color:var(--muted); font-size:15px; }
  .levels { display:grid; grid-template-columns: repeat(auto-fill,minmax(84px,1fr)); gap:10px; margin-top:12px; }
  .lvl { background:var(--card); border:1px solid var(--line); border-radius:14px; min-height:64px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .lvl .n { font-size:20px; font-weight:650; }
  .lvl .s { font-size:12px; color:var(--muted); }
  .lvl.done { border-color:var(--accent); }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:48px; }
  .bar .title { font-weight:650; font-size:17px; }
  .counts { font-size:15px; color:var(--muted); text-align:right; min-width:100px; }
  .counts b { color:var(--ink); }
  #hint { text-align:center; margin:6px 8px 0; color:var(--muted); font-size:15px; min-height:40px; }
  .boardWrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas#cv { width:min(94vw,58vh,480px); aspect-ratio:1; touch-action:none; border-radius:18px; background:var(--card); border:1px solid var(--line); }
  .bottom { justify-content:center; gap:14px; }
  .bottom .secondary { min-width:92px; padding:0 16px; }
  .help { width:44px; padding:0; font-weight:700; font-size:18px; border:1.5px solid var(--line); background:var(--card); }
  .left { display:flex; align-items:center; gap:4px; }
  .dots { display:flex; justify-content:center; gap:8px; margin-top:14px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:var(--line); }
  .dots i.on { background:var(--accent); }
  .overlay { position:fixed; inset:0; background:rgba(40,35,30,.4); display:flex; align-items:center; justify-content:center; padding:20px; z-index:5; }
  .sheet { background:var(--card); border-radius:20px; padding:22px; width:min(100%,360px); text-align:center; }
  .sheet h2 { margin:0 0 6px; font-size:26px; }
  .sheet p { margin:0; color:var(--muted); font-size:16px; }
  .stack { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 64px); max-width:min(92vw,420px); text-align:center; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<main id="home" class="view">
  <h1>Blend Path</h1>
  <p class="sub">Draw lines between dots. Colors blend along the way. Use every dot and color every tile.</p>
  <section class="card">
    <div class="eyebrow" id="todayDate"></div>
    <div class="big" id="todayStatus"></div>
    <button class="primary" id="playToday">Play today's puzzle</button>
  </section>
  <button class="primary wide" id="continueBtn">Play</button>
  <div class="levels" id="levels"></div>

</main>

<main id="game" class="view" hidden>
  <header class="bar">
    <div class="left">
      <button class="ghost" id="backBtn" aria-label="Back to menu">&lsaquo; Menu</button>
      <button class="ghost help" id="helpBtn" aria-label="How to play">?</button>
    </div>
    <div class="title" id="gameTitle"></div>
    <div class="counts"><span id="mvl"></span><br><span id="unl"></span><br><span id="hnl"></span></div>
  </header>
  <p id="hint"></p>
  <div class="boardWrap"><canvas id="cv" aria-label="Puzzle board"></canvas></div>
  <footer class="bar bottom">
    <button class="secondary" id="undoBtn">Undo</button>
    <button class="secondary" id="hintBtn">Hint</button>
    <button class="secondary" id="restartBtn">Start over</button>
  </footer>
</main>

<div id="win" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <h2 id="winTitle">Nicely blended!</h2>
    <p id="winText"></p>
    <div class="stack">
      <button class="primary wide" id="nextBtn">Next level</button>
      <button class="secondary wide" id="shareBtn">Share result</button>
      <button class="ghost wide" id="winMenuBtn">Back to menu</button>
    </div>
  </div>
</div>
<div id="tut" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tutTitle">
    <h2 id="tutTitle"></h2>
    <p id="tutText"></p>
    <div class="dots" id="tutDots"></div>
    <div class="stack">
      <button class="primary wide" id="tutNext">Next</button>
      <button class="ghost wide" id="tutSkip">Skip</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

// iOS < 16 roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

// ---------- colour model ----------
// Every colour is a hue on one wheel (same brightness). Blending goes the SHORT way round the wheel,
// so mixes are always clean (red + yellow = orange) and never muddy.
const HUES = { R: 0, Y: 55, G: 130, B: 220, P: 290 };
const HKEYS = Object.keys(HUES);
const TOL = 9;                         // degrees a ring may be off and still count
const col = (h, a = 1) => `hsla(${Math.round(h)},72%,55%,${a})`;
const mixHue = (h1, h2, t) => { const d = ((h2 - h1 + 540) % 360) - 180; return (((h1 + d * t) % 360) + 360) % 360; };
const hueDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const arc = (a, b) => hueDiff(HUES[a], HUES[b]);
function rng(a) { return function () { let t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(rnd, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const nbrs = (n, i) => { const r = Math.floor(i / n), c = i % n, a = []; if (r > 0) a.push(i - n); if (r < n - 1) a.push(i + n); if (c > 0) a.push(i - 1); if (c < n - 1) a.push(i + 1); return a; };

// =====================================================================
// BLEND PATH levels: the lines together always cover the whole board.
// A random snake through every tile is cut into pieces; each piece is one line.
// =====================================================================
function hamPath(rnd, n) {                       // random path through all n*n tiles ("backbite" shuffling)
  let p = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) p.push(r * n + (r % 2 ? n - 1 - c : c));
  for (let it = 0; it < n * n * 40; it++) {
    if (rnd() < 0.5) p.reverse();
    const opts = nbrs(n, p[0]).filter(x => x !== p[1]);
    if (!opts.length) continue;
    const j = p.indexOf(opts[Math.floor(rnd() * opts.length)]);
    p = p.slice(0, j).reverse().concat(p.slice(j));
  }
  return p;
}
function pathParams(k) {
  if (k === 1)  return { n: 2, pairs: 1, tpp: 2 };
  if (k === 2)  return { n: 3, pairs: 1, tpp: 3 };
  if (k === 3)  return { n: 3, pairs: 2, tpp: 2 };
  if (k <= 5)   return { n: 4, pairs: 3, tpp: 3 };    // short lines + lots of rings: easiest 4x4
  if (k <= 8)   return { n: 4, pairs: 3, tpp: 2 };
  if (k <= 12)  return { n: 5, pairs: 4, tpp: 3 };
  if (k <= 18)  return { n: 5, pairs: 4, tpp: 2 };
  return { n: 6, pairs: 5, tpp: 3 };
}
const PATH_HINTS = {
  1: 'Drag from the red dot to the yellow dot. Every tile must end up colored.',
  2: 'One long line has to fill the whole board and hit every ring.',
  3: 'Two lines now. They can\'t cross, and together they cover every tile.',
  4: 'Three lines. Each ring shows the color its tile needs, so start with the dots next to a ring.',
  6: 'Fewer rings this time. Use every dot and fill every tile.',
  9: 'A bigger board with four lines.',
};
function genPath(seed, P) {
  const rnd = rng(seed), n = P.n, N = n * n, minL = n >= 3 ? 3 : 2;
  const p = hamPath(rnd, n);
  const lens = new Array(P.pairs).fill(minL);
  for (let rem = N - P.pairs * minL; rem > 0; rem--) lens[Math.floor(rnd() * lens.length)]++;
  const paths = []; let at = 0;
  lens.forEach(L => { paths.push(p.slice(at, at + L)); at += L; });
  const keys = [], seen = new Set();
  for (let q = 0; q < P.pairs; q++) {
    for (let t = 0; t < 200; t++) {
      const s = shuffle(rnd, HKEYS), a = s[0], b = s[1], id = [a, b].sort().join();
      if (arc(a, b) >= 70 && !seen.has(id)) { keys.push([a, b]); seen.add(id); break; }
    }
  }
  const sources = [], targets = [];
  paths.forEach((path, q) => {
    const a = HUES[keys[q][0]], b = HUES[keys[q][1]], L = path.length;
    sources.push({ r: Math.floor(path[0] / n), c: path[0] % n, h: a });
    sources.push({ r: Math.floor(path[L - 1] / n), c: path[L - 1] % n, h: b });
    shuffle(rnd, Array.from({ length: L - 2 }, (_, i) => i + 1)).slice(0, Math.min(P.tpp, L - 2))
      .forEach(k => targets.push({ r: Math.floor(path[k] / n), c: path[k] % n, h: mixHue(a, b, k / (L - 1)) }));
  });
  return { kind: 'path', n, sources, targets, walls: [], sol: paths, hint: '' };
}
// Proof that a level is possible: the stored solution must fill every tile, use every dot,
// never cross itself, and match every ring. A level that fails is thrown away and rebuilt.
function verifyPath(l) {
  const n = l.n, cov = new Set(), srcCells = new Set(l.sources.map(s => s.r * n + s.c));
  if (l.sources.length !== 2 * l.sol.length) return false;
  for (const p of l.sol) {
    for (let i = 0; i < p.length; i++) { if (cov.has(p[i])) return false; cov.add(p[i]); if (i && !nbrs(n, p[i - 1]).includes(p[i])) return false; }
    const a = l.sources.find(s => s.r * n + s.c === p[0]), b = l.sources.find(s => s.r * n + s.c === p[p.length - 1]);
    if (!a || !b || a === b) return false;
    for (let k = 1; k < p.length - 1; k++) if (srcCells.has(p[k])) return false;      // a dot may only be a line end
    for (const t of l.targets) { const k = p.indexOf(t.r * n + t.c); if (k >= 0 && (k === 0 || k === p.length - 1 || hueDiff(t.h, mixHue(a.h, b.h, k / (p.length - 1))) > TOL)) return false; }
  }

}
function buildPath(seed, P) {
  for (let attempt = 0; attempt < 30; attempt++) { const l = genPath(seed + attempt * 131, P); if (verifyPath(l)) return l; }
  throw new Error('could not build a valid level');
}
const pathCache = new Map();
function getPath(k) {
  if (!pathCache.has(k)) { const l = buildPath(k * 7919 + 13, pathParams(k)); l.hint = PATH_HINTS[k] || 'Fill every ring, use every dot, color every tile.'; pathCache.set(k, l); }
  return pathCache.get(k);
}
const ymd = (d = new Date()) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
function getDaily(day) {
  const key = 'D' + day;
  if (!pathCache.has(key)) { const l = buildPath(day * 1000003 + 17, { n: 6, pairs: 5, tpp: 3 }); l.hint = 'Fill every ring, use every dot, color every tile.'; pathCache.set(key, l); }
  return pathCache.get(key);
}

// ---------- save ----------
const KEY = 'blendpath-save-v2';
const obj = o => (o && typeof o === 'object' ? o : {});
function loadSave() {
  let s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  s = obj(s);
  return { completed: +s.completed || 0, best: obj(s.best), daily: obj(s.daily), tut: !!s.tut };
}
let save = loadSave();
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
const better = (a, b) => !b || a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// ---------- game state ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let G = null, L = null, moves = 0, undos = 0, won = false, winAt = 0;
let SZ = 300, DPR = 1, PAD = 10, CS = 60, wallSet = new Set();
// blend-path state
let paths = [], drawing = null, srcAt = new Map();
let lastPos = null, headX = 0, headY = 0;
let hints = 0, ghost = null, flash = null, demo = null;

const cellX = i => PAD + (i % L.n + 0.5) * CS;
const cellY = i => PAD + (Math.floor(i / L.n) + 0.5) * CS;
function owner() { const o = new Array(L.n * L.n).fill(-1); paths.forEach((p, pi) => p.cells.forEach(c => { o[c] = pi; })); return o; }
function pathHues(a, b, len) { const out = []; for (let k = 0; k < len; k++) out.push(mixHue(srcAt.get(a).h, srcAt.get(b).h, k / (len - 1))); return out; }
function hueMap() { const m = new Map(); paths.forEach(p => p.cells.forEach((c, k) => m.set(c, p.hues[k]))); return m; }
function matched() {
  const hm = hueMap();
  return L.targets.map(t => { const h = hm.get(t.r * L.n + t.c); return h != null && hueDiff(h, t.h) <= TOL; });
}
const coveredCount = () => paths.reduce((s, p) => s + p.cells.length, 0);

function startLevelSpec(spec) {
  G = spec;
  L = spec.mode === 'daily' ? getDaily(spec.date) : getPath(spec.level);
  wallSet = new Set(L.walls || []);
  srcAt = new Map((L.sources || []).map(s => [s.r * L.n + s.c, s]));
  paths = []; drawing = null;
  moves = 0; undos = 0; hints = 0; ghost = null; flash = null; demo = null; won = false;
  $('gameTitle').textContent = spec.mode === 'daily' ? 'Today' : 'Level ' + spec.level;
  $('hint').textContent = L.hint || '';
  $('home').hidden = true; $('game').hidden = false; $('win').hidden = true;
  updateHud(); resize(); requestAnimationFrame(resize);
  if (spec.mode === 'level' && spec.level === 1 && !save.tut) setTimeout(showTut, 350);
  else if (spec.mode === 'level' && spec.level <= 2) startDemo();
}
const openLevel = k => startLevelSpec({ kind: 'path', mode: 'level', level: k });
const openDaily = () => startLevelSpec({ kind: 'path', mode: 'daily', date: ymd() });

function updateHud() {
  $('mvl').innerHTML = '<b>' + moves + '</b> ' + (moves === 1 ? 'move' : 'moves');
  $('unl').innerHTML = '<b>' + undos + '</b> ' + (undos === 1 ? 'undo' : 'undos');
  $('hnl').innerHTML = hints ? '<b>' + hints + '</b> ' + (hints === 1 ? 'hint' : 'hints') : '';
  $('undoBtn').disabled = won || !paths.length;
}
function commitPath(cells) {
  const a = cells[0], b = cells[cells.length - 1];
  paths.push({ a, b, cells: cells.slice(), hues: pathHues(a, b, cells.length), t: performance.now() });
  moves++; drawing = null; updateHud(); checkWin();
}
function undo() {
  if (won) return;
  if (!paths.length) return; paths.pop();
  undos++; updateHud();
}
function erasePath(pi) { paths.splice(pi, 1); undos++; updateHud(); }
function isSolved() {
  if (!L.targets.length || !matched().every(Boolean)) return false;
  return coveredCount() === L.n * L.n;   // every tile colored, so every dot is used
}
function checkWin() {
  if (won || !isSolved()) return;
  won = true; winAt = performance.now(); updateHud();
  const cur = [moves, undos]; let isBest = false;
  if (G.mode === 'level') {
    const prev = save.best[G.level]; if (better(cur, prev)) { save.best[G.level] = cur; isBest = !!prev; }
    save.completed = Math.max(save.completed, G.level);
  } else {
    const prev = save.daily[G.date]; if (better(cur, prev)) { save.daily[G.date] = cur; isBest = !!prev; }
  }
  persist(); setTimeout(() => showWin(isBest), 700);
}
function bestOf() { return G.mode === 'level' ? save.best[G.level] : save.daily[G.date]; }
function showWin(isBest) {
  const lvl = G.mode === 'level', best = bestOf();
  let t = (lvl ? 'Level ' + G.level : "Today's puzzle") + ': ' + plural(moves, 'move') + ', ' + plural(undos, 'undo') + (hints ? ', ' + plural(hints, 'hint') : '') + '.';
  if (isBest) t += ' A new best!'; else if (best && (best[0] !== moves || best[1] !== undos)) t += ' Best: ' + plural(best[0], 'move') + ', ' + plural(best[1], 'undo') + '.';
  $('winText').textContent = t; $('nextBtn').hidden = !lvl; $('win').hidden = false;
}

// ---------- input ----------
function cellFromXY(x, y) {
  const c = Math.floor((x - PAD) / CS), r = Math.floor((y - PAD) / CS);
  return (c < 0 || r < 0 || c >= L.n || r >= L.n) ? -1 : r * L.n + c;
}
function posOf(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (SZ / r.width), (e.clientY - r.top) * (SZ / r.height)]; }
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
cv.addEventListener('pointerdown', e => {
  if (!L || won) return; e.preventDefault(); demo = null; ghost = null;
  const [x, y] = posOf(e), cell = cellFromXY(x, y); if (cell < 0) return;
  const own = owner();
  if (srcAt.has(cell)) {
    const pi = paths.findIndex(p => p.a === cell || p.b === cell);
    if (pi >= 0) { erasePath(pi); return; }
    drawing = { start: cell, cells: [cell] }; lastPos = [x, y]; headX = x; headY = y;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (own[cell] >= 0) { erasePath(own[cell]); }
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return; e.preventDefault();
  const [x, y] = posOf(e);
  const dx = x - lastPos[0], dy = y - lastPos[1], steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (CS * 0.25)));
  for (let s = 1; s <= steps && drawing; s++) follow(lastPos[0] + dx * s / steps, lastPos[1] + dy * s / steps);
  lastPos = [x, y]; headX = x; headY = y;
});
// The head chases the finger: it steps into whichever neighbouring tile is nearest the finger,
// so diagonal and wobbly drags work (no need to hit tiles exactly).
function follow(x, y) {
  for (let g = 0; g < 12 && drawing; g++) {
    const cs = drawing.cells, last = cs[cs.length - 1];
    const dl = Math.hypot(x - cellX(last), y - cellY(last));
    const prev = cs.length > 1 ? cs[cs.length - 2] : -1;
    const opts = nbrs(L.n, last).map(i => ({ i, d: Math.hypot(x - cellX(i), y - cellY(i)) }))
      .filter(o => o.d < dl - (o.i === prev ? CS * 0.06 : CS * 0.02)).sort((a, b) => a.d - b.d);
    let moved = false;
    for (const o of opts) { if (step(o.i)) { moved = true; break; } }
    if (!moved) return;
  }
}
function step(cell) {
  const cs = drawing.cells;
  if (cs.length > 1 && cell === cs[cs.length - 2]) { cs.pop(); return true; }   // drag back to shorten
  if (cs.includes(cell) || wallSet.has(cell)) return false;
  if (srcAt.has(cell)) {
    if (paths.some(p => p.a === cell || p.b === cell)) return false;           // that dot already has a line
    cs.push(cell); commitPath(cs); return true;
  }

}
function endDrag() { drawing = null; lastPos = null; }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ---------- drawing ----------
function resize() {
  if (!L) return;
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  SZ = r.width; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(SZ * DPR); cv.height = Math.round(SZ * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CS = (SZ - PAD * 2) / L.n;
}
addEventListener('resize', resize);
function seg(x1, y1, x2, y2, h1, h2, w) {
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  g.addColorStop(0, col(h1)); g.addColorStop(1, col(h2));
  ctx.strokeStyle = g; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ring(t, ok, pulse, dim) {
  const n = L.n, i = t.r * n + t.c, x = cellX(i), y = cellY(i), R = CS * 0.36 * (ok ? pulse : 1);
  ctx.lineWidth = ok ? CS * 0.075 : CS * 0.06; ctx.strokeStyle = col(t.h); ctx.setLineDash(ok ? [] : [CS * 0.1, CS * 0.08]);
  ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  if (ok) { ctx.strokeStyle = '#fff'; ctx.lineWidth = CS * 0.06; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - CS * 0.09, y + CS * 0.005); ctx.lineTo(x - CS * 0.02, y + CS * 0.075); ctx.lineTo(x + CS * 0.1, y - CS * 0.07); ctx.stroke(); }
}
function draw(now) {
  if (!L || $('game').hidden) return;
  ctx.clearRect(0, 0, SZ, SZ);
  const n = L.n, mt = matched(), hm = hueMap();
  // tiles: a tile that a line covers is filled with that line's colour
  for (let i = 0; i < n * n; i++) {
    const x = PAD + (i % n) * CS, y = PAD + Math.floor(i / n) * CS, h = hm && hm.get(i);
    ctx.fillStyle = wallSet.has(i) ? '#8f877b' : (h != null ? col(h, 0.42) : '#ece6d8');
    ctx.beginPath(); ctx.roundRect(x + 3, y + 3, CS - 6, CS - 6, CS * 0.18); ctx.fill();
    if (wallSet.has(i)) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + CS * 0.3, y + CS * 0.3); ctx.lineTo(x + CS * 0.7, y + CS * 0.7); ctx.moveTo(x + CS * 0.7, y + CS * 0.3); ctx.lineTo(x + CS * 0.3, y + CS * 0.7); ctx.stroke();
    }
  }
  const pulse = won ? 1 + 0.08 * Math.sin((now - winAt) / 120) : 1;
  paths.forEach(p => {
    const age = Math.min(1, (now - p.t) / 250), w = CS * (0.16 + 0.06 * Math.sin(age * Math.PI));
    for (let k = 0; k < p.cells.length - 1; k++) seg(cellX(p.cells[k]), cellY(p.cells[k]), cellX(p.cells[k + 1]), cellY(p.cells[k + 1]), p.hues[k], p.hues[k + 1], w);
    for (let k = 1; k < p.cells.length - 1; k++) { ctx.fillStyle = col(p.hues[k]); ctx.beginPath(); ctx.arc(cellX(p.cells[k]), cellY(p.cells[k]), CS * 0.15, 0, 7); ctx.fill(); }
  });
  if (ghost && now < ghost.until) {                       // hint: the line to try, as a dashed outline
    const c = ghost.cells; ctx.strokeStyle = 'rgba(45,42,38,' + (0.45 + 0.25 * Math.sin(now / 160)) + ')'; ctx.lineWidth = CS * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([CS * 0.16, CS * 0.2]); ctx.lineDashOffset = -now / 40;
    ctx.beginPath(); ctx.moveTo(cellX(c[0]), cellY(c[0])); for (let k = 1; k < c.length; k++) ctx.lineTo(cellX(c[k]), cellY(c[k])); ctx.stroke(); ctx.setLineDash([]);
  } else ghost = null;
  if (flash && now < flash.until && paths[flash.i]) {      // hint: a drawn line that is not in the solution
    const c = paths[flash.i].cells; ctx.strokeStyle = 'rgba(200,60,50,' + (0.35 + 0.35 * Math.sin(now / 110)) + ')'; ctx.lineWidth = CS * 0.34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cellX(c[0]), cellY(c[0])); for (let k = 1; k < c.length; k++) ctx.lineTo(cellX(c[k]), cellY(c[k])); ctx.stroke();
  } else flash = null;
  if (demo && !paths.length && !drawing) {                 // tutorial: a finger shows how to drag
    const c = demo.path, prog = Math.min(1, (((now - demo.t0) / 2600) % 1.5)), f = prog * (c.length - 1), k = Math.min(c.length - 2, Math.floor(f)), u = f - k;
    ctx.strokeStyle = 'rgba(45,42,38,.4)'; ctx.lineWidth = CS * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cellX(c[0]), cellY(c[0])); for (let j = 1; j <= k; j++) ctx.lineTo(cellX(c[j]), cellY(c[j]));
    const fx = cellX(c[k]) + (cellX(c[k + 1]) - cellX(c[k])) * u, fy = cellY(c[k]) + (cellY(c[k + 1]) - cellY(c[k])) * u; ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = 'rgba(45,42,38,.85)'; ctx.beginPath(); ctx.arc(fx, fy, CS * 0.16, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(fx, fy, CS * 0.16, 0, 7); ctx.stroke();
  } else if (demo && (paths.length || drawing)) demo = null;
  if (drawing && drawing.cells.length > 1) {
    const h = srcAt.get(drawing.start).h, cs = drawing.cells;
    ctx.strokeStyle = col(h, 0.55); ctx.lineWidth = CS * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cellX(cs[0]), cellY(cs[0])); for (let k = 1; k < cs.length; k++) ctx.lineTo(cellX(cs[k]), cellY(cs[k])); ctx.stroke();
  }
  if (drawing) {
    const h = srcAt.get(drawing.start).h, cs = drawing.cells, last = cs[cs.length - 1];
    ctx.strokeStyle = col(h, 0.35); ctx.lineWidth = CS * 0.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cellX(last), cellY(last)); ctx.lineTo(headX, headY); ctx.stroke();
    ctx.fillStyle = col(h, 0.9); ctx.beginPath(); ctx.arc(headX, headY, CS * 0.12, 0, 7); ctx.fill();
  }
  L.targets.forEach((t, i) => ring(t, mt[i], pulse));
  L.sources.forEach(s => {
    const i = s.r * n + s.c, used = paths.some(p => p.a === i || p.b === i);
    ctx.fillStyle = col(s.h); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cellX(i), cellY(i), CS * 0.27, 0, 7); ctx.fill(); ctx.stroke();
    if (!used) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(cellX(i) - CS * 0.08, cellY(i) - CS * 0.09, CS * 0.06, 0, 7); ctx.fill(); }
  });
}
(function loop(now) { draw(now || performance.now()); requestAnimationFrame(loop); })();

// ---------- UI ----------
function fmtDate(d) { return new Date(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); }
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 2200); }
function fillGrid(box, upto, best, open) {
  box.innerHTML = '';
  for (let k = 1; k <= upto; k++) {
    const b = document.createElement('button'); b.className = 'lvl' + (best[k] ? ' done' : '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = k;
    const s = document.createElement('span'); s.className = 's'; s.textContent = best[k] ? plural(best[k][0], 'move') : 'new';
    b.append(n, s); b.onclick = () => open(k); box.appendChild(b);
  }
}
function renderHome() {
  const today = ymd(); $('todayDate').textContent = fmtDate(today);
  const t = save.daily[today];
  $('todayStatus').textContent = t ? 'Solved in ' + plural(t[0], 'move') + ', ' + plural(t[1], 'undo') : 'Not played yet';
  $('playToday').textContent = t ? 'Play it again' : "Play today's puzzle";
  $('continueBtn').textContent = 'Play level ' + (save.completed + 1);
  fillGrid($('levels'), save.completed + 1, save.best, openLevel);
}
function goHome() { $('game').hidden = true; $('win').hidden = true; $('home').hidden = false; renderHome(); }
$('playToday').onclick = openDaily;
$('continueBtn').onclick = () => openLevel(save.completed + 1);
$('backBtn').onclick = goHome;
$('undoBtn').onclick = undo;
$('restartBtn').onclick = () => { if (paths.length && !won && !confirm('Start this puzzle over?')) return; startLevelSpec(G); };
$('winMenuBtn').onclick = goHome;

// ---------- hint ----------
// Shows the next line of the solution. If a drawn line is not part of the solution, that line flashes red instead.
const keyOf = c => c.join(','), revOf = c => c.slice().reverse().join(',');
function hint() {
  if (!L || won) return;
  const now = performance.now(), good = new Set(); L.sol.forEach(p => { good.add(keyOf(p)); good.add(revOf(p)); });
  demo = null;
  const bad = paths.findIndex(p => !good.has(keyOf(p.cells)));
  hints++; updateHud();
  if (bad >= 0) { flash = { i: bad, until: now + 3000 }; ghost = null; toast("The flashing line isn't in the solution I know. Tap it to erase it.", 3200); return; }
  const have = new Set(); paths.forEach(p => { have.add(keyOf(p.cells)); have.add(revOf(p.cells)); });
  const next = L.sol.find(p => !have.has(keyOf(p)));
  if (!next) return;
  ghost = { cells: next, until: now + 5000 }; flash = null; toast('Try drawing the dashed line.', 3200);
}
$('hintBtn').onclick = hint;

// ---------- how to play ----------
const TUT = [
  { t: 'Draw a line', x: 'Drag from one dot to another dot. Your line moves one tile at a time.' },
  { t: 'Colors blend', x: "A line fades from one dot's color to the other. A ring shows the color its tile needs. A tick means it matches." },
  { t: 'Fill the whole board', x: 'Every tile gets colored and every dot is used. Lines can\'t cross. Tap a line to erase it. Stuck? Press Hint.' },
];
let tutStep = 0;
function renderTut() {
  $('tutTitle').textContent = TUT[tutStep].t; $('tutText').textContent = TUT[tutStep].x;
  $('tutNext').textContent = tutStep === TUT.length - 1 ? 'Got it' : 'Next';
  $('tutDots').innerHTML = TUT.map((_, i) => '<i class="' + (i === tutStep ? 'on' : '') + '"></i>').join('');
}
function showTut() { tutStep = 0; renderTut(); $('tut').hidden = false; }
function startDemo() { if (L && !paths.length) demo = { path: L.sol[0], t0: performance.now() }; }
function closeTut() { $('tut').hidden = true; if (!save.tut) { save.tut = true; persist(); } startDemo(); }
$('tutNext').onclick = () => { if (tutStep < TUT.length - 1) { tutStep++; renderTut(); } else closeTut(); };
$('tutSkip').onclick = closeTut;
$('helpBtn').onclick = showTut;
$('nextBtn').onclick = () => openLevel(G.level + 1);

const SHARE_URL = 'https://gamerdolphin.github.io/BlendPath/';
const EMOJI = h => (h < 20 || h >= 340) ? '🟥' : h < 45 ? '🟧' : h < 80 ? '🟨' : h < 170 ? '🟩' : h < 255 ? '🟦' : '🟪';
function shareText() {
  const day = G.mode === 'daily' && new Date(Math.floor(G.date / 10000), Math.floor(G.date / 100) % 100 - 1, G.date % 100).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const head = G.mode === 'daily' ? 'Blend Path · ' + day : 'Blend Path · Level ' + G.level;
  let s = head + '\n' + L.targets.map(t => EMOJI(t.h)).join('') + '\n' + plural(moves, 'move') + ' · ' + plural(undos, 'undo') + (hints ? ' · ' + plural(hints, 'hint') : '');
  s += '\n' + SHARE_URL;   // always the public link, even if played from a different copy
  return s;
}
function copyText(text) {
  const ok = () => toast('Copied. Paste it to share!');
  const fb = () => { const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Could not copy'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
}
$('shareBtn').onclick = async () => {
  const text = shareText();
  try {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const file = new File([blob], 'blend-path.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  copyText(text);
};

// test hooks (also handy in the console)
window.__bp = { getPath, getDaily, genPath, buildPath, verifyPath, openLevel, openDaily, commitPath, undo, matched, isSolved, hint, showTut, closeTut,
  state: () => ({ L, paths, moves, undos, hints, ghost, flash, demo: !!demo, won, G, drawing: drawing && drawing.cells.slice(), geo: { SZ, CS, PAD, n: L && L.n } }),
  persistOff: () => { persist = () => {}; } };

renderHome();

// Offline mode: after the first visit the game keeps working with no internet.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
